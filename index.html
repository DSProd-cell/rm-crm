<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="color-scheme" content="light"/>
<title>CRM Hub</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:#fff}
  #hubBar{height:36px;display:flex;align-items:center;gap:8px;padding:0 16px;background:#F8FAFC;border-bottom:1px solid #E2E8F0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:12px;color:#64748B}
  #hubBar b{color:#0F172A;font-weight:600}
  #hubRoleSelect{height:26px;font:inherit;font-size:12.5px;font-weight:600;color:#0F172A;background:#fff;border:1px solid #CBD5E1;border-radius:6px;padding:0 8px;cursor:pointer}
  #frameWrap{position:relative;width:100vw;height:calc(100vh - 36px)}
  #appFrame{width:100%;height:100%;border:none;display:block}
  #loadingOverlay{
    position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;transition:opacity .15s;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  #loadingOverlay.hidden{opacity:0;pointer-events:none}
  .spinner{width:26px;height:26px;border-radius:50%;border:3px solid #E2E8F0;border-top-color:#443EFF;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loadingText{font-size:12.5px;color:#94A3B8;font-weight:600}
</style>
</head>
<body>
<div id="hubBar"><b>Demo</b><span>Viewing as</span><select id="hubRoleSelect" aria-label="Role"></select></div>
<div id="frameWrap">
  <iframe id="appFrame" title="CRM"></iframe>
  <div id="loadingOverlay"><div class="spinner"></div><div id="loadingText">Loading…</div></div>
</div>

<script>
/*
 * Unifies RM CRM and Counsellor (Leap) CRM into one page. A thin demo bar
 * at the top (#hubBar) holds the role picker for both products, so each
 * app's own header stays exactly as it is. Picking a role either calls that
 * app's own role-switch function directly (same product, instant, no
 * reload) or swaps the iframe to the other app and lands on that role
 * (cross-product, one reload).
 *
 * Neither app's own source files are modified for this — the hub only calls
 * into the (same-origin) iframe after it loads.
 */

const HUB = {
  rm: {
    label: 'RM CRM',
    url: 'rm-crm/index.html',
    roles: [
      { value:'rm',             label:'RM (Student Success Manager)' },
      { value:'team_lead',      label:'Team Lead' },
      { value:'senior_manager', label:'Senior Manager' },
      { value:'admin',          label:'Admin' },
    ],
    defaultRole: 'rm',
    applyRole(win, role) { if (typeof win.switchRole === 'function') win.switchRole(role); },
  },
  leap: {
    label: 'Counsellor CRM',
    url: 'leap-crm/index.html',
    roles: [
      { value:'skip_counselor', label:'Skipping 1st Call Counsellor' },
      { value:'counselor',      label:'Counsellor' },
      { value:'team_lead',      label:'Counsellor TL' },
      { value:'pod_leader',     label:'Counsellor POD Leader' },
      { value:'senior_manager', label:'Counsellor SM' },
      { value:'director',       label:'Director' },
      { value:'ops_admin',      label:'Ops Admin' },
    ],
    defaultRole: 'counselor',
    defaultEmail: {
      skip_counselor:'priya@edu.in', counselor:'priya@edu.in', team_lead:'sneha@edu.in', pod_leader:'arjun.m@edu.in',
      senior_manager:'nisha.sm@edu.in', director:'rajesh@edu.in', ops_admin:'nisha@edu.in',
    },
    applyRole(win, role) { if (typeof win.bootApp === 'function') win.bootApp(role, this.defaultEmail[role]); },
  },
};

let currentProduct = 'rm';
let currentRole = HUB.rm.defaultRole;

const frameEl = document.getElementById('appFrame');
const loadingOverlay = document.getElementById('loadingOverlay');

function showLoading(text) {
  document.getElementById('loadingText').textContent = text || 'Loading…';
  loadingOverlay.classList.remove('hidden');
}
function hideLoading() { loadingOverlay.classList.add('hidden'); }

// Called from inside either iframe's injected control (same product: role-only
// change) or cross-product (needs the iframe swapped to the other app).
function hubGoTo(product, role) {
  if (product === currentProduct) {
    currentRole = role;
    syncHubSelect();
    const win = frameEl.contentWindow;
    if (win) HUB[product].applyRole(win, role);
    return;
  }
  currentProduct = product;
  currentRole = role;
  showLoading(`Loading ${HUB[product].label}…`);
  frameEl.src = HUB[product].url + '?_hub=' + Date.now();
}
window.hubGoTo = hubGoTo;

// ── Role picker lives in its own top bar (#hubBar), outside both apps, so
// neither CRM's header is modified.
const hubSel = document.getElementById('hubRoleSelect');
hubSel.innerHTML = Object.entries(HUB).map(([product, cfg]) =>
  `<optgroup label="${cfg.label}">${cfg.roles.map(r => `<option value="${product}:${r.value}">${r.label}</option>`).join('')}</optgroup>`
).join('');
function syncHubSelect() { hubSel.value = currentProduct + ':' + currentRole; }
hubSel.onchange = function () {
  const [product, role] = this.value.split(':');
  hubGoTo(product, role);
};

// RM CRM keeps its own built-in #rolePicker; mirror its changes into the hub bar.
function watchRmPicker(doc) {
  const sel = doc.getElementById('rolePicker');
  if (!sel) return;
  sel.value = currentRole;
  if (sel.dataset.hubWatched) return;
  sel.dataset.hubWatched = '1';
  sel.addEventListener('change', () => { currentRole = sel.value; syncHubSelect(); });
}

frameEl.addEventListener('load', () => {
  const win = frameEl.contentWindow;
  const doc = frameEl.contentDocument;
  setTimeout(() => {
    try { HUB[currentProduct].applyRole(win, currentRole); } catch (e) { /* app kept its own default role — fine */ }
    if (currentProduct === 'rm') { try { watchRmPicker(doc); } catch (e) { /* header markup not ready — non-fatal */ } }
    syncHubSelect();
    hideLoading();
  }, 60);
});

// ── Init: land on RM CRM's default role.
showLoading('Loading RM CRM…');
frameEl.src = HUB.rm.url + '?_hub=' + Date.now();
</script>
</body>
</html>
