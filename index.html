<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="color-scheme" content="light"/>
<title>CRM Hub</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:#fff}
  #frameWrap{position:relative;width:100vw;height:100vh}
  #appFrame{width:100%;height:100%;border:none;display:block}
  #loadingOverlay{
    position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;transition:opacity .15s;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  #loadingOverlay.hidden{opacity:0;pointer-events:none}
  .spinner{width:26px;height:26px;border-radius:50%;border:3px solid #E2E8F0;border-top-color:#443EFF;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loadingText{font-size:12.5px;color:#94A3B8;font-weight:600}
</style>
</head>
<body>
<div id="frameWrap">
  <iframe id="appFrame" title="CRM"></iframe>
  <div id="loadingOverlay"><div class="spinner"></div><div id="loadingText">Loading…</div></div>
</div>

<script>
/*
 * Unifies RM CRM and Counsellor (Leap) CRM into one page with ONE visible
 * header — whichever app's own header is currently on screen. There is no
 * separate shell top bar. Instead, the existing role control already built
 * into each app is extended (RM CRM's real <select id="rolePicker">, and a
 * matching control injected into Leap CRM's header, which has no built-in
 * one) with extra options for the OTHER product's roles too. Picking one
 * either calls that app's own role-switch function directly (same product,
 * instant, no reload) or asks this parent page to swap the iframe to the
 * other app and land on that role (cross-product, one reload).
 *
 * Neither app's own source files are modified — everything here is done by
 * scripting the (same-origin) iframe's DOM after it loads.
 */

const HUB = {
  rm: {
    label: 'RM CRM',
    url: 'rm-crm/index.html',
    roles: [
      { value:'rm',             label:'RM (Student Success Manager)' },
      { value:'team_lead',      label:'Team Lead' },
      { value:'senior_manager', label:'Senior Manager' },
      { value:'admin',          label:'Admin' },
    ],
    defaultRole: 'rm',
    applyRole(win, role) { if (typeof win.switchRole === 'function') win.switchRole(role); },
  },
  leap: {
    label: 'Counsellor CRM',
    url: 'leap-crm/index.html',
    roles: [
      { value:'counselor',      label:'Counsellor' },
      { value:'team_lead',      label:'Counsellor TL' },
      { value:'pod_leader',     label:'Counsellor POD Leader' },
      { value:'senior_manager', label:'Counsellor SM' },
      { value:'director',       label:'Director' },
      { value:'ops_admin',      label:'Ops Admin' },
    ],
    defaultRole: 'counselor',
    defaultEmail: {
      counselor:'priya@edu.in', team_lead:'sneha@edu.in', pod_leader:'arjun.m@edu.in',
      senior_manager:'nisha.sm@edu.in', director:'rajesh@edu.in', ops_admin:'nisha@edu.in',
    },
    applyRole(win, role) { if (typeof win.bootApp === 'function') win.bootApp(role, this.defaultEmail[role]); },
  },
};

let currentProduct = 'rm';
let currentRole = HUB.rm.defaultRole;

const frameEl = document.getElementById('appFrame');
const loadingOverlay = document.getElementById('loadingOverlay');

function showLoading(text) {
  document.getElementById('loadingText').textContent = text || 'Loading…';
  loadingOverlay.classList.remove('hidden');
}
function hideLoading() { loadingOverlay.classList.add('hidden'); }

// Called from inside either iframe's injected control (same product: role-only
// change) or cross-product (needs the iframe swapped to the other app).
function hubGoTo(product, role) {
  if (product === currentProduct) {
    currentRole = role;
    const win = frameEl.contentWindow;
    if (win) HUB[product].applyRole(win, role);
    return;
  }
  currentProduct = product;
  currentRole = role;
  showLoading(`Loading ${HUB[product].label}…`);
  frameEl.src = HUB[product].url + '?_hub=' + Date.now();
}
window.hubGoTo = hubGoTo;

// ── Build the <option>/<optgroup> list for "the other product's roles",
// used to extend whichever app's control is currently on screen.
function otherProductOptionsHtml(product) {
  const other = product === 'rm' ? 'leap' : 'rm';
  const cfg = HUB[other];
  const opts = cfg.roles.map(r => `<option value="${other}:${r.value}">${r.label}</option>`).join('');
  return `<optgroup label="${cfg.label}">${opts}</optgroup>`;
}

// ── RM CRM: extend its own real #rolePicker select in place.
function wireRmHeader(doc) {
  const sel = doc.getElementById('rolePicker');
  if (!sel || sel.dataset.hubWired) { if (sel) sel.value = currentRole; return; }
  sel.dataset.hubWired = '1';
  sel.insertAdjacentHTML('beforeend', otherProductOptionsHtml('rm'));
  sel.value = currentRole;
  sel.onchange = function () {
    const v = this.value;
    if (v.startsWith('leap:')) { hubGoTo('leap', v.slice(5)); return; }
    hubGoTo('rm', v);
  };
}

// ── Leap CRM: it has no built-in role control, so inject one that matches
// its own header's visual style, placed inline before the profile button
// (same row, not a second bar).
function wireLeapHeader(doc) {
  let sel = doc.getElementById('hubRolePicker');
  if (sel) { sel.value = currentRole; return; }
  const header = doc.querySelector('header');
  if (!header) return;
  const avatar = doc.getElementById('headerAvatar');
  const profileWrap = avatar ? avatar.closest('.relative') : null; // the Profile block specifically, not the search box's own .relative wrapper
  const wrapHtml = `
    <div id="hubRolePickerWrap" style="display:flex;align-items:center;gap:6px;padding:6px 10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:8px;margin-right:10px;flex-shrink:0">
      <span style="font-size:10px;color:rgba(255,255,255,.5);white-space:nowrap">Role</span>
      <select id="hubRolePicker" style="font-size:12px;color:#fff;background:transparent;border:none;outline:none;cursor:pointer;font-weight:600;appearance:none">
        ${HUB.leap.roles.map(r => `<option value="leap:${r.value}" style="color:#0F172A">${r.label}</option>`).join('')}
        ${otherProductOptionsHtml('leap')}
      </select>
    </div>`;
  if (profileWrap) profileWrap.insertAdjacentHTML('beforebegin', wrapHtml);
  else header.insertAdjacentHTML('beforeend', wrapHtml);
  sel = doc.getElementById('hubRolePicker');
  sel.value = 'leap:' + currentRole;
  sel.onchange = function () {
    const v = this.value;
    const [product, role] = v.includes(':') ? v.split(':') : ['leap', v];
    hubGoTo(product, role);
  };
}

function wireHeaderFor(product, doc) {
  if (product === 'rm') wireRmHeader(doc);
  else wireLeapHeader(doc);
}

frameEl.addEventListener('load', () => {
  const win = frameEl.contentWindow;
  const doc = frameEl.contentDocument;
  setTimeout(() => {
    try { HUB[currentProduct].applyRole(win, currentRole); } catch (e) { /* app kept its own default role — fine */ }
    try { wireHeaderFor(currentProduct, doc); } catch (e) { /* header markup not ready — non-fatal */ }
    hideLoading();
  }, 60);
});

// ── Init: land on RM CRM's default role.
showLoading('Loading RM CRM…');
frameEl.src = HUB.rm.url + '?_hub=' + Date.now();
</script>
</body>
</html>
